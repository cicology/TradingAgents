[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oryares-desk"
version = "0.1.0"
description = "AI analysis desk for gold, indices, and crypto via OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[project.scripts]
desk = "trading_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
